name: Build PokeRogue for muOS (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PokeRogue Offline Assets
        run: |
          mkdir -p build/pokerogue/game
          echo "Descargando release offline..."
          ZIP_URL=$(curl -s https://api.github.com/repos/Admiral-Billy/Pokerogue-App/releases/latest | grep -o 'https://[^"]*Pokerogue[^"]*\.zip' | head -n 1)
          if [ -z "$ZIP_URL" ]; then
            ZIP_URL="https://github.com/Admiral-Billy/Pokerogue-App/releases/latest/download/Pokerogue.zip"
          fi
          echo "URL: $ZIP_URL"
          curl -L -o pokerogue.zip "$ZIP_URL" || true
          if [ -f pokerogue.zip ] && unzip -tq pokerogue.zip; then
            unzip -q pokerogue.zip -d build/pokerogue/game
          else
            echo "Fallback: clonando codigo web..."
            git clone --depth 1 https://github.com/pagefaultgames/pokerogue.git build/pokerogue/game
          fi

      - name: Package Runtime and muOS launcher
        run: |
          mkdir -p build/pokerogue/bin
          mkdir -p build/pokerogue/libs

          if [ -f "Pokerogue.sh" ]; then
            cp Pokerogue.sh build/pokerogue/
          elif [ -f "PORT_POKEROGUE/Pokerogue.sh" ]; then
            cp PORT_POKEROGUE/Pokerogue.sh build/pokerogue/
          fi

          echo "[port]" > build/pokerogue/pokerogue.ini
          echo "title=PokeRogue" >> build/pokerogue/pokerogue.ini
          echo "desc=Pokemon Roguelike Web Port" >> build/pokerogue/pokerogue.ini
          echo "version=1.0" >> build/pokerogue/pokerogue.ini

      - name: Create Release Zip
        run: |
          cd build
          zip -r9 ../pokerogue-muos-aarch64.zip pokerogue/

      - name: Upload Port Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokerogue-muos-aarch64
          path: pokerogue-muos-aarch64.zip
