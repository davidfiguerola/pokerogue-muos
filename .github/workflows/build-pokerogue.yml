name: Build PokeRogue for muOS (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download PokeRogue Offline Game Data
        run: |
          mkdir -p build/pokerogue/game
          echo "Descargando el juego offline real (game.zip de ~500MB)..."
          curl -L -o game.zip https://github.com/Admiral-Billy/pokerogue/releases/download/release-e4e9b53/game.zip
          unzip -q game.zip -d build/pokerogue/game
          rm game.zip

      - name: Package muOS Port Structure
        run: |
          mkdir -p build/pokerogue/bin
          mkdir -p build/pokerogue/libs

          if [ -f "Pokerogue.sh" ]; then
            cp Pokerogue.sh build/pokerogue/
          elif [ -f "PORT_POKEROGUE/Pokerogue.sh" ]; then
            cp PORT_POKEROGUE/Pokerogue.sh build/pokerogue/
          fi

          echo "[port]" > build/pokerogue/pokerogue.ini
          echo "title=PokeRogue" >> build/pokerogue/pokerogue.ini
          echo "desc=Pokemon Roguelike Offline Port" >> build/pokerogue/pokerogue.ini
          echo "version=1.0" >> build/pokerogue/pokerogue.ini

      - name: Create Release Zip
        run: |
          cd build
          zip -r9 ../pokerogue-muos-aarch64.zip pokerogue/

      - name: Upload Port Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokerogue-muos-aarch64
          path: pokerogue-muos-aarch64.zip
