name: Build PokeRogue for muOS (aarch64)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for aarch64
        uses: docker/setup-qemu-action@v3

      - name: Download PokeRogue Offline Assets
        run: |
          mkdir -p build/pokerogue/game
          echo "Buscando la última versión en GitHub Releases..."
          ASSET_URL=$(curl -s https://api.github.com/repos/Admiral-Billy/Pokerogue-App/releases/latest | grep "browser_download_url.*zip" | cut -d : -f 2,3 | tr -d \" | head -n 1)
          
          if [ -n "$ASSET_URL" ]; then
            echo "Descargando desde: $ASSET_URL"
            curl -L -o pokerogue.zip $ASSET_URL
            unzip -q pokerogue.zip -d build/pokerogue/game
          else
            echo "Descargando repositorio directo..."
            git clone --depth 1 https://github.com/pagefaultgames/pokerogue.git build/pokerogue/game
          fi

      - name: Package Runtime and muOS launcher
        run: |
          mkdir -p build/pokerogue/bin
          mkdir -p build/pokerogue/libs

          # Copiar Pokerogue.sh buscando en la raíz o en subcarpetas, o crearlo si falta
          if [ -f "Pokerogue.sh" ]; then
            cp Pokerogue.sh build/pokerogue/
          elif [ -f "PORT_POKEROGUE/Pokerogue.sh" ]; then
            cp PORT_POKEROGUE/Pokerogue.sh build/pokerogue/
          else
            echo "Generando Pokerogue.sh automático..."
            cat << 'EOF' > build/pokerogue/Pokerogue.sh
#!/bin/bash
DIR="$(dirname "$(readlink -f "$0")")"
cd "$DIR" || exit 1
LOG="$DIR/pokerogue.log"
exec > >(tee -a "$LOG") 2>&1

echo "Iniciando PokeRogue en muOS..."
SWAP_FILE="$DIR/swapfile"
if [ ! -f "$SWAP_FILE" ]; then
    echo "Creando archivo SWAP de 1GB..."
    dd if=/dev/zero of="$SWAP_FILE" bs=1M count=1024
    mkswap "$SWAP_FILE"
fi
swapon "$SWAP_FILE" 2>/dev/null

export LD_LIBRARY_PATH="$DIR/libs:$LD_LIBRARY_PATH"
export SDL_VIDEODRIVER=kmsdrm

PORT=8089
python3 -m http.server $PORT --directory "$DIR/game" &
SERVER_PID=$!
sleep 1

if [ -f "$DIR/bin/cog" ]; then
    "$DIR/bin/cog" --platform=drm "http://127.0.0.1:$PORT" &
    GAME_PID=$!
elif [ -f "$DIR/bin/wpe-launcher" ]; then
    "$DIR/bin/wpe-launcher" "http://127.0.0.1:$PORT" &
    GAME_PID=$!
fi

wait "$GAME_PID"
kill "$SERVER_PID" 2>/dev/null
swapoff "$SWAP_FILE" 2>/dev/null
EOF
          fi

          chmod +x build/pokerogue/Pokerogue.sh

          # Crear descriptor para muOS
          cat << 'EOF' > build/pokerogue/pokerogue.ini
          [port]
          title=PokeRogue
          desc=Pokemon Roguelike Web Port for muOS
          author=Port
          version=1.0
          EOF

      - name: Create Release Zip
        run: |
          cd build
          zip -r9 ../pokerogue-muos-aarch64.zip pokerogue/

      - name: Upload Port Artifact
        uses: actions/upload-artifact@v4
        with:
          name: pokerogue-muos-aarch64
          path: pokerogue-muos-aarch64.zip
